
name: Build KingPrimeExecutor APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Install Gradle (if wrapper missing)
        run: |
          if [ ! -f "./gradlew" ]; then
            sudo apt-get update
            sudo apt-get install -y gradle
            echo "Using system Gradle"
          else
            chmod +x ./gradlew
            echo "Using Gradle Wrapper"
          fi

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon --stacktrace
          else
            gradle build --no-daemon --stacktrace
          fi

      - name: Find Generated APK
        run: |
          echo "Searching for APK files..."

          find "$GITHUB_WORKSPACE" \
            -type f -name "*.apk" -print

          APK_COUNT=$(find "$GITHUB_WORKSPACE" \
            -type f -path "*/build/outputs/apk/*" \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK files were generated!"
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s)."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingPrimeExecutor-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
