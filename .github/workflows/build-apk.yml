
name: Build KingPrimeExecutor APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Install Gradle (if wrapper missing)
        run: |
          if [ ! -f "./gradlew" ]; then
            sudo apt-get update
            sudo apt-get install -y gradle
            echo "Using system Gradle"
          else
            chmod +x ./gradlew
            echo "Using Gradle Wrapper"
          fi

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build --path-info --no-daemon --stacktrace
          else
            gradle build --path-info --no-daemon --stacktrace
          fi

    
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: KingPrimeExecutor-APK
          path: |
            app/build/outputs/apk/debug/
          if-no-files-found: warn
          retention-days: 7
